services:
  recall:
    build: .
    container_name: recall
    ports:
      - "3002:3000"
    volumes:
      - recall_storage:/app/storage
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_PATH=/app/storage
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  recall_storage:
