name: recall

services:
  recall:
    build: .
    container_name: recall
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - STORAGE_PATH=/app/data

x-casaos:
  main: recall
  index: /
  port_map: "3000"
  title:
    en_US: Recall
  tagline:
    en_US: Lightweight personal tables and records
  description:
    en_US: A personal, lightweight record-keeping app for custom tables, properties, rows, and attachments.
  icon: ""
  author: you
  developer: you
  category: Productivity
  architectures:
    - amd64
    - arm64
